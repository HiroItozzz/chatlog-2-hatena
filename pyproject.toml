[project]
name = "cha2hatena"
version = "0.1.0"
description = "AI-chatbot conversation summarizer and blog auto-poster"
authors = [
  {name = "Hiroaki Ito", email = "mobiiii24@gmail.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["chatbot", "blog", "hatena", "automation", "gemini"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "authlib>=1.8.0",
    "google-genai>=2.24.0",
    "gspread>=6.2.1",
    "httpx>=0.28.1",
    "openai<3",  # openaiのバージョン3はhttpx2依存があり、authlibはhttpx2を優先使用し壊れるため指定
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests-oauthlib>=2.0.0",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[project.urls]
Repository = "https://github.com/HiroItozzz/chatlog-2-hatena.git"

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project.scripts]
cha2hatena = "cha2hatena.main:main"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.format]
# 個別フォーマット設定
docstring-code-format = true
docstring-code-line-length = 80
